apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: api, namespace: demo, labels: { app: api } }
spec:
  replicas: 4
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
      - name: api
        image: w9-api:1
        imagePullPolicy: IfNotPresent
        ports: [ { name: http, containerPort: 8080 } ]
        env:
        - { name: ERROR_RATE, value: "0" }
        - { name: VERSION,    value: "v3" }
        readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
  strategy:
    canary:                  # Canary
      steps: 
        - setWeight: 25

        - analysis:
            templates:
              - templateName: api-error-rate

        - setWeight: 50
        
        - analysis:
            templates:
              - templateName: api-error-rate

        - setWeight: 100
        
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: demo, labels: { app: api } }
spec:
  selector: { app: api }
  ports: [ { name: http, port: 80, targetPort: 8080 } ]