apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-error-budget-slo-alerts
  namespace: demo
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: api-slo
      rules:
        - alert: ApiHighErrorRate
          expr: |
            (
              sum(rate(flask_http_request_total{namespace="demo", status=~"5.."}[1m]))
              or vector(0)
            )
            /
            clamp_min(
              sum(rate(flask_http_request_total{namespace="demo"}[1m])),
              1
            ) > 0.05
          for: 1m
          labels:
            severity: warning
            app: api
            namespace: demo
          annotations:
            summary: "API error rate is above 5%"
            description: "More than 5% of API requests are returning 5xx in the last 1 minute."